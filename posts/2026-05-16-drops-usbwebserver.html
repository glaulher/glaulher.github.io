n\u003cli\u003e\u003cstrong\u003eMariaDB 11.4.10\u003c/strong\u003e (substitui o MySQL)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ephpMyAdmin 5.2.3\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e1️⃣ Faça backup de tudo\u003c/h2\u003e\n\u003cp\u003eAntes de começar, copie toda a pasta do USBWebserver para um local seguro:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-bash\"\u003e# Crie uma cópia de segurança\nxcopy C:\\USBWebserver C:\\USBWebserver_backup /E /I\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOs arquivos de configuração originais ficam em \u003ccode\u003esettings/\u003c/code\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehttpd.conf\u003c/code\u003e — configuração do Apache\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ephp.ini\u003c/code\u003e — configuração do PHP\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emy.ini\u003c/code\u003e — configuração do MariaDB/MySQL\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eusbwebserver.ini\u003c/code\u003e — config geral da ferramenta\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2\u003e2️⃣ Baixe as versões mais recentes\u003c/h2\u003e\n\u003ch3\u003eApache 2.4.67\u003c/h3\u003e\n\u003cp\u003eAcesse o \u003ca href=\"https://www.apachelounge.com/download/\"\u003eApache Lounge\u003c/a\u003e e baixe o pacote \u003ccode\u003ehttpd-2.4.67-win64-VS18.zip\u003c/code\u003e.\u003c/p\u003e\n\u003ch3\u003ePHP 8.5.6\u003c/h3\u003e\n\u003cp\u003eAcesse \u003ca href=\"https://windows.php.net/download/\"\u003ewindows.php.net\u003c/a\u003e e baixe o \u003cstrong\u003eThread Safe (ZTS)\u003c/strong\u003e x64:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-bash\"\u003e# Link direto (exemplo)\nhttps://windows.php.net/downloads/releases/php-8.5.6-Win32-vs17-x64.zip\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003eMariaDB 11.4.10\u003c/h3\u003e\n\u003cp\u003eAcesse \u003ca href=\"https://mariadb.org/download/\"\u003emariadb.org/download\u003c/a\u003e e baixe o ZIP para Windows x64:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-bash\"\u003e# Link direto (exemplo)\nhttps://archive.mariadb.org/mariadb-11.4.10/winx64-packages/mariadb-11.4.10-winx64.zip\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e3️⃣ Substituindo o Apache\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eApague a pasta \u003ccode\u003eapache2/\u003c/code\u003e do USBWebserver\u003c/li\u003e\n\u003cli\u003eExtraia o conteúdo do \u003ccode\u003ehttpd-2.4.67-win64-VS18.zip\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRenomeie a pasta extraída para \u003ccode\u003eapache2\u003c/code\u003e\u003c/strong\u003e e cole no USBWebserver\u003c/li\u003e\n\u003cli\u003eCopie o \u003ccode\u003esettings/httpd.conf\u003c/code\u003e para \u003ccode\u003eapache2/conf/httpd.conf\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDuplique o executável com o sufixo \u003ccode\u003e_usbwv8\u003c/code\u003e\u003c/strong\u003e:\u003c/li\u003e\n\u003c/ol\u003e\n\u003cpre\u003e\u003ccode class=\"language-bash\"\u003ecopy apache2\\bin\\httpd.exe apache2\\bin\\httpd_usbwv8.exe\n\u003c/code\u003e\u003c/pre\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ O USBWebserver inicia o Apache usando o executável \u003ccode\u003ehttpd_usbwv8.exe\u003c/code\u003e. Sem essa cópia renomeada, o programa não consegue gerenciar o serviço.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eO \u003ccode\u003ehttpd.conf\u003c/code\u003e do USBWebserver usa placeholders que são substituídos automaticamente:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-apache\"\u003eDefine SRVROOT \"c:/Apache24\"\nServerRoot \"{path}/apache2\"\nListen {port}\nServerName localhost:{port}\nDocumentRoot \"{rootdir}\"\n\n# Configuração do PHP\nLoadModule php_module \"{path}/php/php8apache2_4.dll\"\nAddType application/x-httpd-php .php\nPHPIniDir \"{path}/php\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e4️⃣ Substituindo o PHP\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eApague a pasta \u003ccode\u003ephp/\u003c/code\u003e do USBWebserver\u003c/li\u003e\n\u003cli\u003eExtraia o conteúdo do \u003ccode\u003ephp-8.5.6-Win32-vs17-x64.zip\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRenomeie a pasta extraída para \u003ccode\u003ephp\u003c/code\u003e\u003c/strong\u003e e cole no USBWebserver\u003c/li\u003e\n\u003cli\u003eCopie o \u003ccode\u003esettings/php.ini\u003c/code\u003e para \u003ccode\u003ephp/php.ini\u003c/code\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ O \u003ccode\u003ehttpd.conf\u003c/code\u003e carrega o PHP via \u003ccode\u003ephp8apache2_4.dll\u003c/code\u003e. O PHP 8.5.6 já fornece essa DLL com o mesmo nome, então não precisa renomear. Verifique se o arquivo \u003ccode\u003ephp/php8apache2_4.dll\u003c/code\u003e existe.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eVerifique se o \u003ccode\u003ephp.ini\u003c/code\u003e tem as extensões necessárias descomentadas:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-ini\"\u003eextension=curl\nextension=gd\nextension=mbstring\nextension=mysqli\nextension=openssl\nextension=pdo_mysql\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eE o \u003ccode\u003eextension_dir\u003c/code\u003e apontando para o local correto:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-ini\"\u003eextension_dir = \"{path}\\php\\ext\\\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e5️⃣ Substituindo o MySQL pelo MariaDB\u003c/h2\u003e\n\u003cp\u003eEssa é a etapa mais importante. O MariaDB é compatível com MySQL, então você pode usar a mesma pasta \u003ccode\u003emysql/\u003c/code\u003e.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eApague a pasta \u003ccode\u003emysql/\u003c/code\u003e do USBWebserver\u003c/li\u003e\n\u003cli\u003eExtraia o \u003ccode\u003emariadb-11.4.10-winx64.zip\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRenomeie a pasta extraída para \u003ccode\u003emysql\u003c/code\u003e\u003c/strong\u003e e cole no USBWebserver\u003c/li\u003e\n\u003cli\u003eCopie o \u003ccode\u003esettings/my.ini\u003c/code\u003e para \u003ccode\u003emysql/my.ini\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGaranta o \u003ccode\u003emysqld.exe\u003c/code\u003e e duplique com o sufixo \u003ccode\u003e_usbwv8\u003c/code\u003e\u003c/strong\u003e:\u003c/li\u003e\n\u003c/ol\u003e\n\u003cpre\u003e\u003ccode class=\"language-bash\"\u003eREM Se mysqld.exe não existir, copie de mariadbd.exe\ncopy mysql\\bin\\mariadbd.exe mysql\\bin\\mysqld.exe\n\nREM Duplique com o sufixo _usbwv8 (obrigatório)\ncopy mysql\\bin\\mysqld.exe mysql\\bin\\mysqld_usbwv8.exe\n\u003c/code\u003e\u003c/pre\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ \u003cstrong\u003eATENÇÃO:\u003c/strong\u003e O USBWebserver gerencia o banco usando o executável \u003ccode\u003emysqld_usbwv8.exe\u003c/code\u003e.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eO \u003ccode\u003emy.ini\u003c/code\u003e básico:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-ini\"\u003e[mysqld]\nport = 3306\nsql_mode=NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eO USBWebserver inicia o banco via \u003ccode\u003emysql\\bin\\mysqld_usbwv8.exe\u003c/code\u003e, e com essa etapa o MariaDB funcionará perfeitamente.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2\u003e6️⃣ Atualizando o phpMyAdmin\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eApague a pasta \u003ccode\u003ephpmyadmin/\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eBaixe a versão mais recente em \u003ca href=\"https://www.phpmyadmin.net/downloads/\"\u003ephpmyadmin.net\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRenomeie a pasta extraída para \u003ccode\u003ephpmyadmin\u003c/code\u003e\u003c/strong\u003e e cole no USBWebserver\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ O USBWebserver espera a pasta \u003ccode\u003ephpmyadmin/\u003c/code\u003e. O nome dos executáveis do phpMyAdmin (arquivos PHP) não precisa ser alterado.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eO alias já está configurado no \u003ccode\u003ehttpd.conf\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-apache\"\u003eAlias /phpmyadmin \"{path}/phpmyadmin/\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e7️⃣ Verificando as configurações\u003c/h2\u003e\n\u003ch3\u003eusbwebserver.ini\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"language-ini\"\u003e[apache]\nport=80\n[mysql]\nport=3306\n[algemeen]\nslocal=0\nhide=0\nlocal=0\nroot={path}/root\nlang=Portuguese\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e8️⃣ Verifique os executáveis (resumo)\u003c/h2\u003e\n\u003cp\u003eAntes de iniciar, confira se os nomes das pastas e executáveis estão no padrão que o USBWebserver espera:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLocal\u003c/th\u003e\n\u003cth\u003eObrigatório\u003c/th\u003e\n\u003cth\u003eComo obter\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eapache2/bin/httpd.exe\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eServidor Apache\u003c/td\u003e\n\u003ctd\u003eJá vem no zip\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eapache2/bin/httpd_usbwv8.exe\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eGerenciamento USBWebserver\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ecopy httpd.exe httpd_usbwv8.exe\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephp/php8apache2_4.dll\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eMódulo PHP\u003c/td\u003e\n\u003ctd\u003eJá vem no zip\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emysql/bin/mariadbd.exe\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eServidor MariaDB\u003c/td\u003e\n\u003ctd\u003eJá vem no zip\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emysql/bin/mysqld.exe\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCompatibilidade MySQL\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ecopy mariadbd.exe mysqld.exe\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003emysql/bin/mysqld_usbwv8.exe\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eGerenciamento USBWebserver\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ecopy mysqld.exe mysqld_usbwv8.exe\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephpmyadmin/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eInterface web\u003c/td\u003e\n\u003ctd\u003eSó renomear a pasta\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cblockquote\u003e\n\u003cp\u003e⚠️ Os executáveis com sufixo \u003ccode\u003e_usbwv8\u003c/code\u003e são \u003cstrong\u003eobrigatórios\u003c/strong\u003e. O USBWebserver os utiliza para iniciar/parar os serviços. Sem eles, o programa não funciona.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2\u003e9️⃣ Testando o ambiente\u003c/h2\u003e\n\u003cp\u003eInicie o USBWebserver e acesse:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eApache\u003c/strong\u003e: \u003ca href=\"http://localhost\"\u003ehttp://localhost\u003c/a\u003e — deve mostrar a página inicial\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePHP\u003c/strong\u003e: crie um \u003ccode\u003einfo.php\u003c/code\u003e na pasta \u003ccode\u003eroot/\u003c/code\u003e com \u003ccode\u003e\u0026#x3C;?php phpinfo(); ?\u003e\u003c/code\u003e e acesse\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ephpMyAdmin\u003c/strong\u003e: \u003ca href=\"http://localhost/phpmyadmin\"\u003ehttp://localhost/phpmyadmin\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMariaDB\u003c/strong\u003e: Verifique a versão no phpMyAdmin ou via linha de comando:\u003c/li\u003e\n\u003c/ol\u003e\n\u003cpre\u003e\u003ccode class=\"language-bash\"\u003emysql\\bin\\mysql.exe -V\n# Saída: mysql from 11.4.10-MariaDB\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e🧩 Conclusão\u003c/h2\u003e\n\u003cp\u003eCom essas etapas seu USBWebserver estará rodando com as versões mais recentes:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eComponente\u003c/th\u003e\n\u003cth\u003eVersão\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eApache\u003c/td\u003e\n\u003ctd\u003e2.4.67\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePHP\u003c/td\u003e\n\u003ctd\u003e8.5.6\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMariaDB\u003c/td\u003e\n\u003ctd\u003e11.4.10\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ephpMyAdmin\u003c/td\u003e\n\u003ctd\u003e5.2.3\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eTudo portátil, funcionando como antes, mas com desempenho e segurança atualizados.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"main\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"container mx-auto px-5\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex justify-between items-center mb-20 mt-8\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-2xl md:text-4xl font-bold tracking-tight md:tracking-tighter leading-tight\",\"children\":[\"$\",\"$Le\",null,{\"href\":\"/\",\"className\":\"hover:underline\",\"children\":\"Blog\"}]}],[\"$\",\"$Le\",null,{\"href\":\"/\",\"children\":[\"$\",\"p\",null,{\"className\":\"text-sm dark:text-neutral-200 hover:text-sky-700 dark:hover:text-sky-700 flex items-center\",\"children\":[[\"$\",\"svg\",null,{\"xmlns\":\"http://www.w3.org/2000/svg\",\"fill\":\"none\",\"viewBox\":\"0 0 24 24\",\"
