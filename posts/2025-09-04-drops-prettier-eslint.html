nt-plugin-react-hooks eslint-plugin-jsx-a11y \\\neslint-plugin-import eslint-plugin-prettier \\\neslint-import-resolver-typescript eslint-import-resolver-node\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2\u003e2️⃣ Crie o arquivo eslint.config.mjs no root do projeto\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-bash\"\u003e\nimport { dirname } from 'path';\nimport { fileURLToPath } from 'url';\nimport { FlatCompat } from '@eslint/eslintrc';\n\nconst __filename = fileURLToPath(import.meta.url);\nconst __dirname = dirname(__filename);\n\nconst compat = new FlatCompat({\n  baseDirectory: __dirname,\n  recommendedConfig: { rules: {} },\n});\n\nconst eslintConfig = [\n  ...compat.config({\n    extends: [\n      'eslint:recommended',\n      'plugin:react/recommended',\n      'plugin:react-hooks/recommended',\n      'plugin:@typescript-eslint/recommended',\n      'plugin:jsx-a11y/recommended',\n      'plugin:import/errors',\n      'plugin:import/warnings',\n      'plugin:prettier/recommended',\n    ],\n\n    plugins: [\n      'react',\n      'react-hooks',\n      '@typescript-eslint',\n      'jsx-a11y',\n      'import',\n      'prettier',\n    ],\n\n      settings: {\n      'import/resolver': {\n        typescript: true,\n        node: true,\n      },\n    },\n\n    rules: {\n      // Regras React/TS personalizadas\n      'react/react-in-jsx-scope': 'off', // React 17+\n      'react/prop-types': 'off', // se usar TS\n      '@typescript-eslint/explicit-function-return-type': 'off',\n\n      // Prettier\n      'prettier/prettier': [\n        'error',\n        {\n          trailingComma: 'all',\n          printWidth: 80,\n          tabWidth: 2,\n          arrowParens: 'always',\n          singleQuote: true,\n          semi: true,\n          endOfLine: 'auto',\n        },\n      ],\n    },\n  }),\n];\n\nexport default eslintConfig;\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e3️⃣ O que cada plugin faz\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eeslint:recommended\u003c/strong\u003e\tAtiva as regras recomendadas do ESLint, como evitar variáveis não usadas, uso correto de operadores, etc.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eplugin:react/recommended\u003c/strong\u003e\tFornece regras específicas para React, garantindo boas práticas em componentes, props e JSX.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eplugin:react-hooks/recommended\u003c/strong\u003e\tGarante o uso correto dos Hooks do React, evitando erros comuns como dependências faltando no useEffect.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eplugin:@typescript-eslint/recommended\u003c/strong\u003e\tAdiciona regras específicas do TypeScript, como tipagem correta de funções e variáveis.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eplugin:jsx-a11y/recommended\u003c/strong\u003e\tAjuda a tornar seu app acessível, como adicionar labels em formulários e textos alternativos em imagens.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003e:import/errors + plugin:import/warnings\u003c/strong\u003e\tEvita problemas em importações e exportações, como arquivos faltando ou importações duplicadas.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eplugin:prettier/recommended\u003c/strong\u003e\tIntegra o Prettier ao ESLint, permitindo que regras de formatação sejam aplicadas automaticamente.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eeslint-import-resolver-node + eslint-import-resolver-typescript\u003c/strong\u003e Garante que o ESLint consiga verificar se os imports que você escreveu realmente existem no ambiente.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e4️⃣ Configuração do editor\u003c/h2\u003e\n\u003cp\u003etenha os plugins prettier e eslint instalados no editor para o funcionamento da configuração\u003c/p\u003e\n\u003cp\u003eExemplo de configuração no settings do vscode:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-json\"\u003e{\n  {   \n    //copie sem os comentário para não dar erro no json\n    \n    // Formata automaticamente ao salvar\n    \"editor.formatOnSave\": true,\n    \n    // ESLint vai validar esses tipos de arquivos\n    \"eslint.validate\": [\n      \"javascript\",\n      \"javascriptreact\",\n      \"typescript\",\n      \"typescriptreact\"\n    ],\n\n    // Aplica ESLint fix automaticamente ao salvar para todos os tipos de arquivo do projeto\n     \n    \"[javascript, javascriptreact, typescript, typescriptreact]\": {\n      \"editor.codeActionsOnSave\": {\n        \"source.fixAll.eslint\": \"explicit\"\n      },\n      // Define o Prettier como o formatador padrão\n      \"editor.defaultFormatter\": \"esbenp.prettier-vscode\",\n    },   \n  }\n}\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e🧩 Conclusão\u003c/h2\u003e\n\u003cp\u003eCom essa configuração, seu projeto Vite + React + TypeScript fica pronto para desenvolvimento, mantendo código limpo, consistente e acessível.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"main\",null,{\"children\":[\"$\",\"div\",null,{\"className\":\"container mx-auto px-5\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex justify-between items-center mb-20 mt-8\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-2xl md:text-4xl font-bold tracking-tight md:tracking-tighter leading-tight\",\"children\":[\"$\",\"$Le\",null,{\"href\":\"/\",\"className\":\"hover:underline\",\"children\":\"Blog\"}]}],[\"$\",\"$Le\",null,{\"href\":\"/\",\"children\":[\"$\",\"p\",null,{\"className\":\"text-sm dark:text-neutral-200 hover:text-sky-700 dark:hover:text-sky-700 flex items-center\",\"children\":[[\"$\",\"svg\",null,{\"xmlns\":\"http://www.w3.org/2000/svg\",\"fill\":\"none\",\"viewBox\":\"0 0 24 24\",\"strokeWidth\":2,\"stroke\":\"currentColor\
